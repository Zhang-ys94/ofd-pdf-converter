<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>OFD ⇄ PDF 格式转换器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 640px; overflow: hidden; }
.header { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); color: #fff; padding: 28px 32px; text-align: center; }
.header h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: 0.85; }
.body { padding: 24px 32px; }

/* 方向选择 */
.direction { display: flex; gap: 10px; margin-bottom: 20px; }
.dir-btn { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; color: #555; transition: all 0.2s; text-align: center; }
.dir-btn:hover { border-color: #1a73e8; color: #1a73e8; }
.dir-btn.active { border-color: #1a73e8; background: #e8f0fe; color: #1a73e8; }

/* 拖拽上传区 */
.drop-zone { border: 2px dashed #c0c0c0; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; position: relative; }
.drop-zone:hover, .drop-zone.drag-over { border-color: #1a73e8; background: #f8faff; }
.drop-zone .icon { font-size: 48px; margin-bottom: 10px; }
.drop-zone .title { font-size: 15px; color: #333; font-weight: 500; margin-bottom: 4px; }
.drop-zone .hint { font-size: 12px; color: #999; }
.drop-zone input { display: none; }

/* 文件列表 */
.file-list { margin-bottom: 16px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
.file-item .name { color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; }
.file-item .remove { background: none; border: none; color: #999; cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
.file-item .remove:hover { color: #e53935; }

/* 进度 */
.progress-wrap { margin-bottom: 16px; display: none; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, #1a73e8, #0d47a1); border-radius: 4px; transition: width 0.3s; width: 0; }
.progress-text { font-size: 12px; color: #666; margin-top: 6px; }

/* 按钮 */
.actions { display: flex; gap: 10px; }
.btn { flex: 1; padding: 12px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-primary:disabled { background: #a0c4f0; cursor: not-allowed; }
.btn-outline { background: #fff; color: #1a73e8; border: 2px solid #1a73e8; }
.btn-outline:hover { background: #e8f0fe; }
.btn-download { background: #0d904f; color: #fff; }
.btn-download:hover { background: #0a6d3d; }

/* 结果 */
.result { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 13px; display: none; text-align: left; white-space: pre-wrap; word-break: break-all; }
.result.success { background: #e8f5e9; color: #2e7d32; display: block; }
.result.error { background: #ffebee; color: #c62828; display: block; }

.footer { text-align: center; padding: 0 32px 24px; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>OFD ⇄ PDF 格式转换器</h1>
    <p>纯浏览器端转换，文件不会上传到服务器</p>
  </div>
  <div class="body">
    <div class="direction" id="directionGroup">
      <button class="dir-btn active" data-dir="auto">自动识别</button>
      <button class="dir-btn" data-dir="ofd2pdf">OFD → PDF</button>
      <button class="dir-btn" data-dir="pdf2ofd">PDF → OFD</button>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <div class="title">点击选择文件 或 拖拽文件到此处</div>
      <div class="hint">支持 .ofd 和 .pdf 格式，可多选</div>
      <input type="file" id="fileInput" multiple accept=".ofd,.pdf">
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">准备中...</div>
    </div>

    <div class="actions">
      <button class="btn btn-outline" id="btnClear">清空列表</button>
      <button class="btn btn-primary" id="btnConvert" disabled>开始转换</button>
    </div>

    <div class="result" id="resultMsg"></div>
    <div class="actions" id="downloadActions" style="display:none; margin-top: 12px;"></div>
  </div>
  <div class="footer">基于 liteofd + pdf.js + jsPDF 构建 · 纯浏览器端</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script src="liteofd-bundle.js"></script>
<script>
// ── 库加载检测 ──
(function() {
  var missing = [];
  if (typeof JSZip === 'undefined') missing.push('JSZip');
  if (typeof jspdf === 'undefined') missing.push('jsPDF');
  if (typeof pdfjsLib === 'undefined') missing.push('pdf.js');
  if (missing.length > 0) {
    var el = document.getElementById('resultMsg');
    el.innerHTML = '库加载失败: ' + missing.join(', ') + '<br><small>请刷新页面重试</small>';
    el.className = 'result error';
    document.getElementById('btnConvert').disabled = true;
  }
})();

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';

// ── 全局状态 ──
const state = {
  direction: 'auto',
  files: [],
  results: []
};

// ── DOM 引用 ──
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const dropZone = $('#dropZone');
const fileInput = $('#fileInput');
const fileList = $('#fileList');
const progressWrap = $('#progressWrap');
const progressFill = $('#progressFill');
const progressText = $('#progressText');
const btnConvert = $('#btnConvert');
const btnClear = $('#btnClear');
const resultMsg = $('#resultMsg');
const downloadActions = $('#downloadActions');
const directionGroup = $('#directionGroup');

// ── 方向选择 ──
directionGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.dir-btn');
  if (!btn) return;
  $$('.dir-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.direction = btn.dataset.dir;
});

// ── 拖拽上传 ──
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

function addFiles(incoming) {
  const valid = incoming.filter(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    return ext === 'ofd' || ext === 'pdf';
  });
  if (valid.length < incoming.length) {
    showResult('部分文件已跳过（仅支持 .ofd 和 .pdf 格式）', 'error');
  }
  for (const f of valid) {
    if (!state.files.some(x => x.name === f.name && x.size === f.size)) {
      state.files.push(f);
    }
  }
  state.results = [];
  downloadActions.innerHTML = '';
  downloadActions.style.display = 'none';
  hideResult();
  renderFileList();
}

function removeFile(index) {
  state.files.splice(index, 1);
  state.results = [];
  downloadActions.innerHTML = '';
  downloadActions.style.display = 'none';
  hideResult();
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = state.files.map((f, i) =>
    `<div class="file-item">
      <span class="name">${escHtml(f.name)} <span style="color:#999;font-size:11px">(${formatSize(f.size)})</span></span>
      <button class="remove" onclick="removeFile(${i})" title="移除">&times;</button>
    </div>`
  ).join('');
  btnConvert.disabled = state.files.length === 0;
}

btnClear.addEventListener('click', () => {
  state.files = [];
  state.results = [];
  downloadActions.innerHTML = '';
  downloadActions.style.display = 'none';
  hideResult();
  renderFileList();
  progressWrap.style.display = 'none';
});

// ── 转换主流程 ──
btnConvert.addEventListener('click', async () => {
  if (!state.files.length) return;
  btnConvert.disabled = true;
  progressWrap.style.display = 'block';
  hideResult();
  downloadActions.innerHTML = '';
  downloadActions.style.display = 'none';
  state.results = [];

  const total = state.files.length;
  for (let i = 0; i < total; i++) {
    const file = state.files[i];
    updateProgress(i, total, `正在转换: ${file.name}`);
    try {
      const output = await convertFile(file, state.direction);
      state.results.push({ name: file.name, output, error: null });
    } catch (err) {
      console.error(err);
      state.results.push({ name: file.name, output: null, error: err.message || String(err) });
    }
  }
  updateProgress(total, total, '转换完成');

	  var ok = state.results.filter(function(r) { return !r.error; });
	  var fail = state.results.filter(function(r) { return r.error; });
	  var msg = '';
	  if (fail.length === 0) {
	    msg = '全部 ' + ok.length + ' 个文件转换成功！';
	  } else if (ok.length === 0) {
	    msg = '全部 ' + fail.length + ' 个文件转换失败';
	  } else {
	    msg = ok.length + ' 成功, ' + fail.length + ' 失败';
	  }
	  for (var fi = 0; fi < state.results.length; fi++) {
	    var r2 = state.results[fi];
	    if (r2.error) {
	      msg += '\n' + r2.name + ': ' + r2.error;
	    }
	  }
	  showResult(msg, fail.length === 0 ? 'success' : (ok.length === 0 ? 'error' : 'success'));

  renderDownloadButtons();
  btnConvert.disabled = false;
});

function renderDownloadButtons() {
  downloadActions.innerHTML = '';
  for (const r of state.results) {
    if (r.output) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-download';
      btn.textContent = `下载 ${r.output.name}`;
      btn.addEventListener('click', () => triggerDownload(r.output));
      downloadActions.appendChild(btn);
    }
  }
  if (state.results.some(r => r.output)) {
    downloadActions.style.display = 'flex';
    downloadActions.style.flexWrap = 'wrap';
  }
}

// ── 文件转换 ──
async function convertFile(file, direction) {
  const ext = file.name.split('.').pop().toLowerCase();
  let dir = direction;
  if (dir === 'auto') {
    if (ext === 'ofd') dir = 'ofd2pdf';
    else if (ext === 'pdf') dir = 'pdf2ofd';
    else throw new Error('无法识别的文件格式');
  }

  if (dir === 'ofd2pdf') {
    if (ext !== 'ofd') throw new Error('请选择 .ofd 文件进行 OFD→PDF 转换');
    return await ofdToPdf(file);
  } else {
    if (ext !== 'pdf') throw new Error('请选择 .pdf 文件进行 PDF→OFD 转换');
    return await pdfToOfd(file);
  }
}

// ── OFD → PDF（liteofd 渲染 + jsPDF 输出） ──
async function ofdToPdf(file) {
  var liteOfd = new liteofd.LiteOfd();
  var ofdDoc;
  try {
    ofdDoc = await liteOfd.parse(file);
  } catch (e) {
    throw new Error("OFD 解析失败: " + (e.message || e));
  }

  var pages = ofdDoc.pages;
  if (!pages || !pages.length) throw new Error("OFD 文档中无页面");

  var pdf = new jspdf.jsPDF({ unit: "pt" });
  var scale = 2;

  for (var i = 0; i < pages.length; i++) {
    var page = pages[i];
    var physBox = (page.pageArea && page.pageArea.physicalBox) ? page.pageArea.physicalBox : [0, 0, 210, 297];
    var pwMM = (physBox[2] || 210) - (physBox[0] || 0);
    var phMM = (physBox[3] || 297) - (physBox[1] || 0);
    var pageW = pwMM * 72 / 25.4;
    var pageH = phMM * 72 / 25.4;

    var pageDiv;
    try {
      pageDiv = liteOfd.renderPage(i, "background-color: white;");
    } catch (e) {
      throw new Error("第 " + (i + 1) + " 页渲染失败: " + (e.message || e));
    }

    var container = document.createElement("div");
    container.style.cssText = "position:absolute;left:-9999px;top:0;";
    container.appendChild(pageDiv);
    document.body.appendChild(container);

    try {
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(pageW * scale);
      canvas.height = Math.round(pageH * scale);
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var svgs = pageDiv.querySelectorAll("svg");
      for (var s = 0; s < svgs.length; s++) {
        var svg = svgs[s];
        var svgData = new XMLSerializer().serializeToString(svg);
        var svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        var url = URL.createObjectURL(svgBlob);
        try {
          await new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () {
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve();
            };
            img.onerror = function () { reject(new Error("SVG 转图片失败")); };
            img.src = url;
          });
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      if (svgs.length === 0) {
        ctx.fillStyle = "#999999";
        ctx.font = (12 * scale) + "px sans-serif";
        ctx.fillText("（此页无可渲染内容）", 10 * scale, 20 * scale);
      }

      pdf.addPage([pageW, pageH]);
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pageW, pageH);
    } finally {
      document.body.removeChild(container);
    }
  }

  pdf.deletePage(1);

  var pdfBytes = pdf.output("arraybuffer");
  var outName = file.name.replace(/.ofd$/i, "") + ".pdf";
  return { name: outName, blob: new Blob([pdfBytes], { type: "application/pdf" }) };
}

// ── PDF → OFD ──
async function pdfToOfd(file) {
  const arrayBuf = await file.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
  const totalPages = pdfDoc.numPages;

  const pageImages = [];
  const scale = 2;

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;

    // 获取 JPEG blob（toBlob 可能返回 null，加保护）
    const jpegBlob = await new Promise(function (resolve, reject) {
      canvas.toBlob(function (b) {
        if (b) resolve(b);
        else reject(new Error('页面 ' + i + ' 渲染失败'));
      }, 'image/jpeg', 0.9);
    });
    pageImages.push({
      width: viewport.width / scale * (25.4 / 72), // pt → mm
      height: viewport.height / scale * (25.4 / 72),
      imageData: await jpegBlob.arrayBuffer(),
      imageExt: 'jpg'
    });
  }

  // 构建 OFD 包
  const zip = new JSZip();
  const now = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 14);
  const docID = now + String(Math.random()).slice(2, 8);

  // OFD.xml
  zip.file('OFD.xml',
    `<?xml version="1.0" encoding="UTF-8"?>
<ofd:OFD xmlns:ofd="http://www.ofdspec.org/2016" Version="1.0" DocType="OFD">
  <ofd:DocBody>
    <ofd:DocInfo>
      <ofd:DocID>${docID}</ofd:DocID>
      <ofd:Title>PDF转OFD</ofd:Title>
      <ofd:Author>网页转换器</ofd:Author>
      <ofd:Creator>OFD-PDF Converter</ofd:Creator>
      <ofd:CreationDate>${now}</ofd:CreationDate>
    </ofd:DocInfo>
    <ofd:DocRoot>Doc_0/Document.xml</ofd:DocRoot>
  </ofd:DocBody>
</ofd:OFD>`);

  // Doc_0/Document.xml
  let pageNodes = '';
  for (let i = 0; i < pageImages.length; i++) {
    pageNodes += `    <ofd:Page ID="${i + 1}" BaseLoc="Pages/Page_${i}/Content.xml"/>\n`;
  }
  zip.file('Doc_0/Document.xml',
    `<?xml version="1.0" encoding="UTF-8"?>
<ofd:Document xmlns:ofd="http://www.ofdspec.org/2016">
  <ofd:CommonData>
    <ofd:MaxUnitID>${pageImages.length}</ofd:MaxUnitID>
    <ofd:PageArea>
      <ofd:PhysicalBox>0 0 ${pageImages[0]?.width || 210} ${pageImages[0]?.height || 297}</ofd:PhysicalBox>
    </ofd:PageArea>
  </ofd:CommonData>
  <ofd:Pages>
${pageNodes}  </ofd:Pages>
</ofd:Document>`);

  // Doc_0/DocumentRes.xml
  let mediaNodes = '';
  for (let i = 0; i < pageImages.length; i++) {
    const ext = pageImages[i].imageExt;
    mediaNodes += `    <ofd:MultiMedia ID="${i + 1}" Type="Image" Format="${ext.toUpperCase()}">
      <ofd:MediaFile>../Res/image_${i}.${ext}</ofd:MediaFile>
    </ofd:MultiMedia>\n`;
  }
  zip.file('Doc_0/DocumentRes.xml',
    `<?xml version="1.0" encoding="UTF-8"?>
<ofd:Res xmlns:ofd="http://www.ofdspec.org/2016" BaseLoc="Res">
  <ofd:MultiMedias>
${mediaNodes}  </ofd:MultiMedias>
</ofd:Res>`);

  // 每页的 Content.xml
  for (let i = 0; i < pageImages.length; i++) {
    const pw = pageImages[i].width;
    const ph = pageImages[i].height;
    zip.file(`Doc_0/Pages/Page_${i}/Content.xml`,
      `<?xml version="1.0" encoding="UTF-8"?>
<ofd:Page xmlns:ofd="http://www.ofdspec.org/2016">
  <ofd:Content>
    <ofd:Layer ID="1">
      <ofd:ImageObject ID="1" CTM="${pw} 0 0 ${ph} 0 0" Boundary="0 0 ${pw} ${ph}" ResourceID="${i + 1}"/>
    </ofd:Layer>
  </ofd:Content>
</ofd:Page>`);
  }

  // 嵌入图片资源
  for (let i = 0; i < pageImages.length; i++) {
    zip.file(`Doc_0/Res/image_${i}.${pageImages[i].imageExt}`, pageImages[i].imageData);
  }

  const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const outName = file.name.replace(/\.pdf$/i, '') + '.ofd';
  return { name: outName, blob: zipBlob };
}

// ── 工具函数 ──
function updateProgress(current, total, text) {
  progressFill.style.width = total ? Math.round(current / total * 100) + '%' : '0%';
  progressText.textContent = text;
}

function showResult(msg, type) {
  resultMsg.textContent = msg;
  resultMsg.className = 'result ' + type;
}

function hideResult() {
  resultMsg.className = 'result';
  resultMsg.textContent = '';
}

function triggerDownload(output) {
  const url = URL.createObjectURL(output.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = output.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
